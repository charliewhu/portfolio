services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    networks:
      - web
    restart: unless-stopped

  sveltekit:
    build: .
    command: node --env-file=.env build
    volumes:
      - ./src/:/app/src/
    env_file:
      - .env
    labels:
      caddy: charlieavery.site
      caddy.reverse_proxy: "{{upstreams 3000}}"
    networks:
      - web
    restart: unless-stopped
    depends_on:
      - caddy

networks:
  web:
    external: true

volumes:
  caddy_data:


